<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<meta name="robots" content="index, follow, max-image-preview:large" />
	<link rel="canonical" href="https://njj.org/events.html" />
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Shree Digambar Jinalaya" />
	<meta property="og:title" content="Jain Events in Nallagandla, Hyderabad | Shree Digambar Jinalaya" />
	<meta property="og:description" content="Upcoming Jain festivals, religious programs, celebrations, and past events in Nallagandla, Hyderabad." />
	<meta property="og:url" content="https://njj.org/events.html" />
	<meta property="og:image" content="https://njj.org/assets/images/Home/Vedi-transparent-clean.png?v=3" />
	<meta name="twitter:card" content="summary_large_image" />
	<link rel="icon" type="image/png" href="assets/images/Home/Logo.png" />
	<title>Events | Shree Digambar Jinalaya, Nallagandla, Hyderabad</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Hind:wght@400;500;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="styles.css?v=5" />
	<script>
		(() => {
			const param = new URLSearchParams(window.location.search).get("scoutTheme");
			document.documentElement.dataset.theme = param || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
		})();
	</script>
</head>
<body class="inner-page">
	<a class="skip-link" href="#main-content">Skip to content</a>

	<main id="main-content">
		<header class="page-masthead">
			<div>
				<h1>Events</h1>
				<p>Gather for worship, learning, celebration, and seva.</p>
			</div>
		</header>

		<section class="section">
			<div class="section-heading reveal">
				<div>
					<h2>Upcoming events</h2>
				</div>
			</div>
			<div class="event-grid" id="event-grid"></div>
		</section>

		<section class="history-band">
			<div class="section">
				<div class="section-heading reveal">
					<div>
						<h2>Event history</h2>
					</div>
				</div>
				<div class="history-list" id="history-list"></div>
			</div>
		</section>

		<dialog class="event-photo-dialog" id="event-photo-dialog" aria-labelledby="event-photo-title">
			<button class="dialog-close" type="button" aria-label="Close event photos">×</button>
			<div class="event-photo-viewer">
				<img src="" alt="" />
				<div class="event-photo-copy">
					<h2 id="event-photo-title"></h2>
					<p></p>
					<div class="event-photo-actions">
						<button class="event-photo-previous" type="button" aria-label="Previous photo">‹</button>
						<span class="event-photo-count" aria-live="polite"></span>
						<button class="event-photo-next" type="button" aria-label="Next photo">›</button>
					</div>
				</div>
			</div>
		</dialog>
	</main>
	<script src="content.js?v=6"></script>
	<script src="event-images.js?v=1"></script>
	<script src="shared-layout.js?v=6"></script>
	<script src="gallery-data.js"></script>
	<script src="app.js"></script>
</body>
</html>
