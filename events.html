<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Upcoming and past temple events." />
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='50' font-size='48'>ॐ</text></svg>" />
	<title>Events | Shree Digambar Jinalaya, Nallagandla, Hyderabad</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Hind:wght@400;500;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="styles.css" />
	<script>
		(() => {
			const param = new URLSearchParams(window.location.search).get("scoutTheme");
			document.documentElement.dataset.theme = param || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
		})();
	</script>
</head>
<body class="inner-page">
	<a class="skip-link" href="#main-content">Skip to content</a>

	<header class="site-header" id="top">
		<div class="header-inner">
			<a class="brand" href="index.html">
				<span class="brand-mark">ॐ</span>
				<span>
					<strong data-temple-name></strong>
					<small>Nallagandla, Hyderabad</small>
				</span>
			</a>
			<button class="menu-button" aria-expanded="false" aria-controls="primary-nav">
				<span class="menu-icon"></span>
				<span class="sr-only">Open navigation</span>
			</button>
			<nav id="primary-nav">
				<a class="active" href="events.html">Events</a>
				<a href="about.html">About</a>
				<a href="gallery.html">Gallery</a>
				<a href="visit.html">Visit</a>
				<a href="contact.html">Contact</a>
				<a class="nav-donate" href="donate.html">Donate</a>
			</nav>
		</div>
	</header>

	<main id="main-content">
		<header class="page-masthead">
			<div>
				<h1>Events</h1>
				<p>Gather for worship, learning, celebration, and seva.</p>
			</div>
		</header>

		<section class="section">
			<div class="section-heading reveal">
				<div>
					<h2>Upcoming events</h2>
				</div>
			</div>
			<div class="event-grid" id="event-grid"></div>
		</section>

		<section class="history-band">
			<div class="section">
				<div class="section-heading reveal">
					<div>
						<h2>Event history</h2>
					</div>
				</div>
				<div class="history-list" id="history-list"></div>
			</div>
		</section>

		<dialog class="event-photo-dialog" id="event-photo-dialog" aria-labelledby="event-photo-title">
			<button class="dialog-close" type="button" aria-label="Close event photos">×</button>
			<div class="event-photo-viewer">
				<img src="" alt="" />
				<div class="event-photo-copy">
					<h2 id="event-photo-title"></h2>
					<p></p>
					<div class="event-photo-actions">
						<button class="event-photo-previous" type="button" aria-label="Previous photo">‹</button>
						<span class="event-photo-count" aria-live="polite"></span>
						<button class="event-photo-next" type="button" aria-label="Next photo">›</button>
					</div>
				</div>
			</div>
		</dialog>
	</main>
	<script src="content.js"></script>
	<script src="shared-layout.js"></script>
	<script src="image-data.js"></script>
	<script src="app.js"></script>
</body>
</html>
