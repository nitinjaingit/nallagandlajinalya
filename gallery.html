<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="View photos of Shree Digambar Jinalaya, Jain festivals, religious programs, and community celebrations in Nallagandla, Hyderabad." />
	<meta name="robots" content="index, follow, max-image-preview:large" />
	<link rel="canonical" href="https://njj.org/gallery.html" />
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Shree Digambar Jinalaya" />
	<meta property="og:title" content="Photo Gallery | Shree Digambar Jinalaya" />
	<meta property="og:description" content="Photos from the Jinalaya, Jain festivals, religious programs, and community celebrations." />
	<meta property="og:url" content="https://njj.org/gallery.html" />
	<meta property="og:image" content="https://njj.org/assets/images/Home/Vedi-transparent-clean.png?v=3" />
	<meta name="twitter:card" content="summary_large_image" />
	<link rel="icon" type="image/png" href="assets/images/Home/Logo.png" />
	<title>Gallery | Shree Digambar Jinalaya, Nallagandla, Hyderabad</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Hind:wght@400;500;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="styles.css?v=6" />
	<script>
		(() => {
			const param = new URLSearchParams(window.location.search).get("scoutTheme");
			document.documentElement.dataset.theme = param || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
		})();
	</script>
</head>
<body class="inner-page">
	<a class="skip-link" href="#main-content">Skip to content</a>

	<main id="main-content">
		<header class="page-masthead">
			<div>
				<p class="eyebrow">From our community</p>
				<h1>Gallery</h1>
				<p>Festivals, seva, and everyday darshan.</p>
			</div>
		</header>

		<section class="section gallery-section">
			<div class="gallery-toolbar">
				<!--<p id="gallery-help">Choose a caption from the date tree to view its photos.</p>-->
				<div class="gallery-view-switch" role="group" aria-label="Gallery view">
					<button class="gallery-view-button is-active" type="button" data-gallery-view="tree" aria-pressed="true">Browse by date</button>
					<button class="gallery-view-button" type="button" data-gallery-view="grid" aria-pressed="false">All photos</button>
				</div>
			</div>
			<div id="gallery-all-view" hidden>
				<div class="gallery-grid" id="gallery-grid"></div>
				<nav class="gallery-pagination" id="gallery-pagination" aria-label="Gallery pages" hidden>
					<button class="gallery-page-button" id="gallery-previous" type="button" aria-label="Previous gallery page">‹</button>
					<p id="gallery-page-status" aria-live="polite"></p>
					<button class="gallery-page-button" id="gallery-next" type="button" aria-label="Next gallery page">›</button>
				</nav>
			</div>
			<div class="gallery-browser" id="gallery-tree-view">
				<nav class="gallery-tree" id="gallery-tree" aria-label="Gallery by date"></nav>
				<div class="gallery-results">
					<div class="gallery-results-heading">
						<h2 id="gallery-selection-title">Select a gallery</h2>
						<p id="gallery-selection-count" aria-live="polite"></p>
					</div>
					<div class="gallery-grid" id="gallery-filtered-grid"></div>
				</div>
			</div>
		</section>

		<dialog id="image-dialog" aria-label="Gallery image preview">
			<button class="dialog-close" type="button" aria-label="Close image preview">×</button>
			<button class="dialog-image-nav dialog-image-previous" type="button" aria-label="Previous image">‹</button>
			<img src="" alt="" />
			<button class="dialog-image-nav dialog-image-next" type="button" aria-label="Next image">›</button>
			<p></p>
		</dialog>
	</main>
	<script src="content.js?v=5"></script>
	<script src="shared-layout.js?v=6"></script>
	<script src="gallery-data.js?v=3"></script>
	<script src="app.js?v=5"></script>
</body>
</html>
