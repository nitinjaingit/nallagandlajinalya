<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Temple and community photo gallery." />
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='50' font-size='48'>ॐ</text></svg>" />
	<title>Gallery | Shree Digambar Jinalaya, Nallagandla, Hyderabad</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Hind:wght@400;500;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="styles.css" />
	<script>
		(() => {
			const param = new URLSearchParams(window.location.search).get("scoutTheme");
			document.documentElement.dataset.theme = param || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
		})();
	</script>
</head>
<body class="inner-page">
	<a class="skip-link" href="#main-content">Skip to content</a>

	<header class="site-header" id="top">
		<div class="header-inner">
			<a class="brand" href="index.html">
				<span class="brand-mark">ॐ</span>
				<span>
					<strong data-temple-name></strong>
					<small>Nallagandla, Hyderabad</small>
				</span>
			</a>
			<button class="menu-button" aria-expanded="false" aria-controls="primary-nav">
				<span class="menu-icon"></span>
				<span class="sr-only">Open navigation</span>
			</button>
			<nav id="primary-nav">
				<a href="events.html">Events</a>
				<a href="about.html">About</a>
				<a class="active" href="gallery.html">Gallery</a>
				<a href="visit.html">Visit</a>
				<a href="contact.html">Contact</a>
				<a class="nav-donate" href="donate.html">Donate</a>
			</nav>
		</div>
	</header>

	<main id="main-content">
		<header class="page-masthead">
			<div>
				<p class="eyebrow">From our community</p>
				<h1>Gallery</h1>
				<p>Festivals, seva, and everyday darshan.</p>
			</div>
		</header>

		<section class="section gallery-section">
			<div class="gallery-toolbar">
				<p>Choose any photo to view it at full size.</p>
			</div>
			<div class="gallery-grid" id="gallery-grid"></div>
			<nav class="gallery-pagination" id="gallery-pagination" aria-label="Gallery pages" hidden>
				<button class="gallery-page-button" id="gallery-previous" type="button" aria-label="Previous gallery page">‹</button>
				<p id="gallery-page-status" aria-live="polite"></p>
				<button class="gallery-page-button" id="gallery-next" type="button" aria-label="Next gallery page">›</button>
			</nav>
		</section>

		<dialog id="image-dialog" aria-label="Gallery image preview">
			<button class="dialog-close" type="button" aria-label="Close image preview">×</button>
			<img src="" alt="" />
			<p></p>
		</dialog>
	</main>
	<script src="content.js"></script>
	<script src="shared-layout.js"></script>
	<script src="image-data.js?v=2"></script>
	<script src="app.js?v=2"></script>
</body>
</html>
